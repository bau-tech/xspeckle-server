# Overrides for a single-host deployment, used on top of
# the deps and speckle files. Secrets and everything specific to the host come
# from .env, which ./install.sh writes: SPECKLE_URL, SPECKLE_PORT, SESSION_SECRET,
# SPECKLE_DB_PASSWORD, MINIO_ROOT_USER, MINIO_ROOT_PASSWORD.
#
#   docker compose -f docker-compose-deps.yml -f docker-compose-speckle.yml -f docker-compose.yml up -d <service>...
#
# Always name the services: the deps file defines many that are not run here.

services:
  speckle-ingress:
    # The only port open to the outside.
    ports: !override
      - "0.0.0.0:${SPECKLE_PORT:-80}:8080"

  speckle-frontend-2:
    environment:
      NUXT_PUBLIC_API_ORIGIN: "${SPECKLE_URL:?Set SPECKLE_URL}"
      NUXT_PUBLIC_BASE_URL: "${SPECKLE_URL:?Set SPECKLE_URL}"
      NUXT_PUBLIC_FF_NEXT_GEN_FILE_IMPORTER_ENABLED: "false"
      NUXT_PUBLIC_FF_LEGACY_FILE_IMPORTS_ENABLED: "true"

  speckle-server:
    environment:
      CANONICAL_URL: "${SPECKLE_URL:?Set SPECKLE_URL}"
      FRONTEND_ORIGIN: "${SPECKLE_URL:?Set SPECKLE_URL}"
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET}"
      POSTGRES_PASSWORD: "${SPECKLE_DB_PASSWORD:?Set SPECKLE_DB_PASSWORD}"
      FILEIMPORT_QUEUE_POSTGRES_URL: "postgresql://speckle:${SPECKLE_DB_PASSWORD:?Set SPECKLE_DB_PASSWORD}@postgres/speckle"
      S3_ACCESS_KEY: "${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}"
      S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}"
      FF_NEXT_GEN_FILE_IMPORTER_ENABLED: "false"
      FF_LEGACY_FILE_IMPORTS_ENABLED: "true"

  webhook-service:
    environment:
      PG_CONNECTION_STRING: "postgres://speckle:${SPECKLE_DB_PASSWORD:?Set SPECKLE_DB_PASSWORD}@postgres/speckle"

  fileimport-service:
    build:
      context: .
      dockerfile: packages/fileimport-service/Dockerfile
    image: speckle/speckle-fileimport-service:local
    restart: always
    environment:
      LOG_LEVEL: "info"
      LOG_PRETTY: "true"
      PG_CONNECTION_STRING: "postgres://speckle:${SPECKLE_DB_PASSWORD:?Set SPECKLE_DB_PASSWORD}@postgres/speckle"
      SPECKLE_SERVER_URL: "http://speckle-server:3000"
    depends_on:
      speckle-server:
        condition: service_healthy

  ifc-import-server:
    environment:
      FILEIMPORT_QUEUE_POSTGRES_URL: "postgresql://speckle:${SPECKLE_DB_PASSWORD:?Set SPECKLE_DB_PASSWORD}@postgres/speckle"

  # The deps file publishes the database, cache and storage ports on the host
  # for development; a server does not need them reachable from outside.
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: "${SPECKLE_DB_PASSWORD:?Set SPECKLE_DB_PASSWORD}"

  redis:
    ports: !reset []

  # MinIO no longer publishes images on Docker Hub, so the deps file's
  # `minio/minio` cannot be pulled. Any image whose entrypoint is the minio
  # binary works; set MINIO_IMAGE in .env to use another one.
  minio:
    image: "${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}"
    ports: !reset []
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}"

