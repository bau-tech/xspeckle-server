    streamId: String!
    commentId: String!
  ): CommentThreadActivityMessage!
    @hasServerRole(role: SERVER_GUEST)
    @hasScope(scope: "streams:read")
    @deprecated(
      reason: "Use projectCommentsUpdated or viewerUserActivityBroadcasted for reply status"
    )
}
